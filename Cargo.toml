[workspace]
members = [
    "ft8-bench",
    "ft8-web",
    "uvpacket-web",
]
exclude = [
    "ft8-desktop/src-tauri",
]
resolver = "2"

# mfsk-core 0.9.0 shipped on crates.io 2026-08-10 — switched back from the
# git-rev pin (was 4e3c7ce3, confirmed an ancestor of the v0.9.0 tag) to a
# plain version pin. Brings `.on_result()` streaming delivery (issue #204,
# PR #237/#239/#240) that ft8-web's decode_phase1_streaming/
# decode_phase2_streaming consume (see ft8-web/src/lib.rs), the
# revoke-less-retract dedup-gate fix (1a4cbda), the FST4 pre-decode
# near-duplicate dedup (issue #244, d22d1cf/22fe013), and the wasm_simd
# rustfft feature enablement (issue #246, 2d94ff4).
[workspace.dependencies]
mfsk-core = { version = "0.9.0", default-features = false }

# Workspace-wide release profile for the WASM cdylibs.
#
# `opt-level = 3` (was `"z"`): LDPC BP+OSD-2 is tight FP/integer-bit
# math and benefits substantially from full inlining + loop-vectorise
# style optimisation. Field measurement on uvpacket-web showed
# `~117 ms/attempt` at `"z"`; with `"3"` that should drop ~30-40 %.
# The wasm-pack output size goes up ~30 % but the network cost is
# dominated by LDPC tables and rustfft, not the codegen, so the user-
# facing diff is small.
#
# `lto = true` keeps the cross-crate inlining pass that lets mfsk-core
# routines vanish across the wasm-bindgen boundary.
[profile.release]
opt-level = 3
lto = true
