[workspace]
members = [
    "ft8-bench",
    "ft8-web",
    "uvpacket-web",
]
exclude = [
    "ft8-desktop/src-tauri",
]
resolver = "2"

# mfsk-core 0.9.0 is unreleased (CHANGELOG "0.9.0 (unreleased)") — pin to its
# main HEAD by rev until it ships on crates.io, then switch back to a plain
# version pin. Brings `.on_result()` streaming delivery (issue #204, PR
# #237/#239/#240), which ft8-web's decode_phase1_streaming/decode_phase2_streaming
# consume (see ft8-web/src/lib.rs). Pinned past commit 1a4cbda ("close
# revoke-less-retract gap in .known()+on_result") specifically — without
# it, decode_phase2's SIC path (.sic_early(), ft8/decode.rs's
# decode_frame_subtract_staged_with_ap_inner) could stream a candidate via
# on_result that a later post-hoc `.known(...)` retain then dropped from
# the final Vec (reproduced on ft8-bench/testdata/qso3_busy.wav: on_result
# fired for K1BZM DK8NE -10 / XE2X HA2NP RR73, neither present in the
# batch result). b087902 (xsnr2 atomicity) alone did not cover this path —
# 1a4cbda threads `known` into the dedup gate itself, closing it for real.
# Also past d22d1cf+22fe013 (FST4 pre-decode near-duplicate dedup, issue
# #244 — reproduced on this project's decode_fst4_wav_streaming: on_result
# fired 9x for one real signal, all but one dropped by post-decode dedup;
# see ft8-web/www/decode-worker.js's `seen` Set for the client-side
# mitigation that stays regardless). d22d1cf's first cut discarded the
# refine it computed for the dedup decision, so every surviving candidate
# recomputed it a second time in process_candidate_basic_impl; 22fe013
# threads the already-computed refine through instead (measured wall-clock
# neutral on the one golden file profiled — eliminates dead recompute, but
# that file's redundant-candidate count was too small to show above noise).
[workspace.dependencies]
mfsk-core = { git = "https://github.com/jl1nie/mfsk-core", rev = "22fe013573094a3dd22a618c0e32f0f6c650ff73", default-features = false }

# Workspace-wide release profile for the WASM cdylibs.
#
# `opt-level = 3` (was `"z"`): LDPC BP+OSD-2 is tight FP/integer-bit
# math and benefits substantially from full inlining + loop-vectorise
# style optimisation. Field measurement on uvpacket-web showed
# `~117 ms/attempt` at `"z"`; with `"3"` that should drop ~30-40 %.
# The wasm-pack output size goes up ~30 % but the network cost is
# dominated by LDPC tables and rustfft, not the codegen, so the user-
# facing diff is small.
#
# `lto = true` keeps the cross-crate inlining pass that lets mfsk-core
# routines vanish across the wasm-bindgen boundary.
[profile.release]
opt-level = 3
lto = true
