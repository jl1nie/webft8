[workspace]
members = [
    "ft8-bench",
    "ft8-web",
    "uvpacket-web",
]
exclude = [
    "ft8-desktop/src-tauri",
]
resolver = "2"

# TEMPORARY git-rev pin ahead of the 0.9.0 crates.io release (which stays the
# baseline: 0.9.0 brought `.on_result()` streaming delivery for issue #204 that
# ft8-web's decode_phase1_streaming/decode_phase2_streaming consume, the
# revoke-less-retract dedup-gate fix, the FST4 pre-decode near-duplicate dedup
# for issue #244, and the wasm_simd rustfft enablement for issue #246).
#
# Pinned to 21c1be7 for three unreleased issue #253 fixes — two false-decode,
# one SNR calibration. This is a field-verification deploy — revert to
# `version = "0.9.x"` once they ship.
#
# The headline fix (65986bc) is aimed squarely at this project: the false decode
# it eliminates (7Y8CIH HN1GD OP30 @509 Hz, hard_errors=31, on
# ft8-bench/testdata/qso3_busy.wav) was originally reproduced *through*
# decode_phase2's exact pipeline shape — Deep + `.known()` + `.fft_cache()` +
# `.sic_early()`. Root cause was `__staged_sic` pre-subtracting the caller's
# `.known()` list from the whole buffer before checkpoint A, the nzhsym=41
# zero-tailed early pass; real jt9 always runs that pass on raw unmodified
# audio, so the pre-subtraction was an mfsk-core-original composition with no
# WSJT-X counterpart, and it manufactured a CRC-14 false accept. The fix scopes
# pre-subtraction to checkpoints B/C only (they rebuild buffers from the
# original audio anyway), so "known signals don't mask weaker ones" survives.
# Upstream's controlled A/B: 7 results incl. the false one before, 22 results
# and none false after.
#
# 3a91c74 additionally retunes DecodeStrictness::Deep's ft8_nharderrors_max
# 40 -> 37 (golden recall saturates by 37; false accepts keep climbing past it
# for no gain). Note it does NOT by itself fix the above — hard_errors=31 clears
# even Normal's 36 — so decode profiles other than Deep were exposed to the same
# false accept too, and 65986bc is what actually closes it for all of them.
#
# 21c1be7 then fixes the reported SNR itself, which had been sitting a
# systematic 3-7 dB below WSJT-X/JTDX (a gap the qso3 recall tests had been
# absorbing with a 12 dB tolerance rather than root-causing). Two compounding
# substitutions: xsig was read from the rectangular-window coarse-sync spectrum
# instead of the cd0/per-symbol-32pt-FFT pipeline real WSJT-X takes it from
# (already ported here for LLR, which is scale-invariant and so never noticed),
# and xbase/sbase came from that same spectrum rather than
# get_spectrum_baseline.f90's Nuttall-windowed 50%-overlap one. Both had to move
# together — the old shared miscalibrated scale mostly cancelled in the ratio,
# which is why the visible gap was smaller than either bug. Post-fix: xsig
# within +0.5 dB of a real jt9 build's probed value, final xsnr2 within ~1 dB,
# qso3 entries mostly within ±3.5 dB of golden.
#
# User-visible here: SNR shifts up by roughly 3-7 dB versus every WebFT8 build
# before this one, and this is NOT display-only. qso.js's `setRxSnr` →
# `_autoReport` feeds the decoded SNR straight into the signal report we
# transmit, so every automatic report this station sends was systematically
# pessimistic by that same 3-7 dB before this rev — reports now land where a
# WSJT-X/JTDX operator's would. Also consumed by app.js:1710's "reply to
# strongest caller" sort (relative among simultaneous callers, so a uniform
# offset doesn't change who wins) and logged into qso-log.js's CSV export. No
# absolute SNR threshold or filter exists anywhere, so nothing silently changes
# what gets decoded or displayed.
[workspace.dependencies]
mfsk-core = { git = "https://github.com/jl1nie/mfsk-core", rev = "21c1be7ad9273c62a8b0a799291580927a8867ef", default-features = false }

# Workspace-wide release profile for the WASM cdylibs.
#
# `opt-level = 3` (was `"z"`): LDPC BP+OSD-2 is tight FP/integer-bit
# math and benefits substantially from full inlining + loop-vectorise
# style optimisation. Field measurement on uvpacket-web showed
# `~117 ms/attempt` at `"z"`; with `"3"` that should drop ~30-40 %.
# The wasm-pack output size goes up ~30 % but the network cost is
# dominated by LDPC tables and rustfft, not the codegen, so the user-
# facing diff is small.
#
# `lto = true` keeps the cross-crate inlining pass that lets mfsk-core
# routines vanish across the wasm-bindgen boundary.
[profile.release]
opt-level = 3
lto = true
