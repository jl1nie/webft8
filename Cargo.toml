[workspace]
members = [
    "ft8-bench",
    "ft8-web",
    "uvpacket-web",
]
exclude = [
    "ft8-desktop/src-tauri",
]
resolver = "2"

# Back on a crates.io release. The git-rev pin that ran from 65986bc to
# 47f0e63 (issues #253/#255/#256/#257/#259/#275) ended here — 0.9.1 contains
# all of it. The rev-by-rev measurement log is archived in
# notes/mfsk-core-pin-log-archive.md rather than deleted; it is the record of
# what was verified at each step and why.
#
# What 0.9.1 brought that this app depends on, verified here rather than
# assumed:
#
#   - WSPR precision + recall (issue #275, bfab491 and the 6-commit wsprd
#     port). Measured through the app's own decode_wspr_wav_f32 with the
#     fixed-seed harness in notes/: recall at -28 dB 7/8 -> 8/8, at -30 dB
#     1/8 -> 7/8, and false decodes across the sweep 16 -> 4. The rare
#     tightening that cost no recall — because it shipped alongside the
#     ~2 dB AWGN-gap closure. Full before/after in
#     notes/wspr-false-decode-baseline.md.
#   - The WSPR/JT65/JT9/Q65 burst-envelope ramp (47f0e63, issue #259), which
#     is what made this app's WSPR beacon TX shippable at all.
#   - The FT4 sniper aim-point fix (e51160b, issue #257) — the ±12 Hz
#     "aiming tolerance" this repo had recorded was the edge of a candidate-
#     starvation bug, not a capture range.
#   - WSJT-X SNR formulas for FT4/FST4/Q65 (#255/#256).
#   - d640bee zero-pads negative reports ("-08"). The packer normalises
#     either spelling to identical bits, so this changed nothing on the air,
#     but it did leave qso.js's own _autoReport as the odd one out — fixed
#     there.
#
# FT8 is unaffected, checked rather than assumed at every step of the pin
# sequence and again here: qso3_busy.wav through phase1 + phase2(Deep) and
# the whole ft8-bench suite are byte-identical to the 11022d5 baseline taken
# before any of this started.
[workspace.dependencies]
mfsk-core = { version = "0.9.1", default-features = false }

# Workspace-wide release profile for the WASM cdylibs.
#
# `opt-level = 3` (was `"z"`): LDPC BP+OSD-2 is tight FP/integer-bit
# math and benefits substantially from full inlining + loop-vectorise
# style optimisation. Field measurement on uvpacket-web showed
# `~117 ms/attempt` at `"z"`; with `"3"` that should drop ~30-40 %.
# The wasm-pack output size goes up ~30 % but the network cost is
# dominated by LDPC tables and rustfft, not the codegen, so the user-
# facing diff is small.
#
# `lto = true` keeps the cross-crate inlining pass that lets mfsk-core
# routines vanish across the wasm-bindgen boundary.
[profile.release]
opt-level = 3
lto = true
