[workspace]
members = [
    "ft8-bench",
    "ft8-web",
    "uvpacket-web",
]
exclude = [
    "ft8-desktop/src-tauri",
]
resolver = "2"

# 0.10.1 -> 0.13.1 (git rev 8ebfc2e6, see below). Breaking: 0.13 made `mfsk_core::decoder` the only public
# decode API. One persistent `Decoder<P>` per mode, driven per period with
# `SlotInput`; `DecodeRequest`/`SniperRequest`, `ft8::decode::*`, the per-mode
# `tones_to_f32` synthesisers and `is_plausible_message` are gone from the
# public surface (`engine::tx::{message_to_tones, synthesize}` replace the
# synthesisers; the decoder owns the hash table and the plausibility filter).
# ft8-web and ft8-desktop were ported to it; ft8-bench instead enables
# `internal-testing`, which keeps the raw engine reachable for its sweeps.
#
# There is no staged/early-decode entry point and no `known`/`fft_cache`
# hand-off, so FT8 Phase 2 can no longer resume from Phase 1. It is rebuilt on
# `decode_with`'s per-row callback: Phase 1 streams a single pass, Phase 2 runs
# the SIC decode and streams only rows Phase 1 did not. The wasm export names
# and JS contract are unchanged. `fft-rustfft` must now be listed explicitly
# for ft8-web: without it `mfsk_core::decoder` is feature-gated away.
#
# Checked: new `Decoder` and the old engine give identical message sets on
# ft8-bench's sim_busy_band / _hard / bpf_edge WAVs; wasm encode lengths and an
# FT8 encode->decode round trip match the 0.10.1 build. qso3_busy.wav (the copy
# in ../mfsk-core/embedded-poc/assets): 21 decodes through decode_wav_subtract
# and through phase1 (15) + phase2 (+6) streaming, the count upstream records
# for `jt9 -8 -d 3`. The 0.10.1 build gave 22: the extra row was
# `<?> 5T5ZGS/R FE02` at -15 dB, an unresolved hash, now gone; five other rows
# moved by <=1 dB SNR or 0.5 Hz. NOT re-measured: Q65 recall.
#
# WSPR: decode_wspr_wav* panicked (`unreachable`) on wasm32 in 0.10.1 and in
# 0.13.1 — mfsk-core's WSPR stage timers called `std::time::Instant::now()`,
# which has no clock on wasm32-unknown-unknown (jl1nie/mfsk-core#583). Fixed
# upstream in 7b67b13a, with a wasm32 CI job in 8ebfc2e6, so the workspace pins
# 8ebfc2e6 by git rev until the next release (0.13.2 is not tagged yet; move
# back to a crates.io version then). With the fix, notes/wspr-decode-baseline.mjs
# on this build: 0 false accepts on 20 noise slots, recall 8/8 down to -28 dB,
# 7/8 at -30 dB (0.9.1 record: 8/8, 7/8, 4 false). ft8-desktop stays on
# crates.io 0.13.1: it uses no WSPR.
#
# 0.9.1 -> 0.10.1. One breaking change reaches this app, and it is in Q65
# only: `q65::SearchParams` replaced the single `time_tolerance_symbols` with
# the pair `time_tolerance_early_sec`/`_late_sec`. That is not a rename to
# paper over — the old unit was genuinely ambiguous here. This repo passed
# `50` symbols for every sub-mode, which is ±15 s at Q65-30A's 0.3 s/symbol
# but ±30 s at Q65-60's 0.6 s/symbol: one literal, two different windows. Both
# happened to cover their slot, so nothing was broken, but the intent ("half a
# slot either side of the slot midpoint") was not what the code said. It now
# says it, in seconds, derived from one `q65_slot_secs` helper shared with the
# midpoint calculation so the two cannot drift apart.
#
# Nothing else in the app moved: FT8/FT4/WSPR/FST4 and the whole
# `DecodeRequest`/`SniperRequest` surface compile unchanged, and ft8-desktop
# touches only FT8 APIs. Workspace `cargo test`, the JS unit suite, and both
# wasm32 release builds are green on 0.10.1.
#
# NOT independently re-measured here: FT8 decode counts on qso3_busy.wav, and
# the WSPR recall/false-decode sweep that justified the 0.9.1 pin below. The
# 0.9.1 notes that follow are the last on-air-relevant measurements taken, so
# treat them as inherited, not reconfirmed, until someone reruns them.
#
# Back on a crates.io release. The git-rev pin that ran from 65986bc to
# 47f0e63 (issues #253/#255/#256/#257/#259/#275) ended here — 0.9.1 contains
# all of it. The rev-by-rev measurement log is archived in
# notes/mfsk-core-pin-log-archive.md rather than deleted; it is the record of
# what was verified at each step and why.
#
# What 0.9.1 brought that this app depends on, verified here rather than
# assumed:
#
#   - WSPR precision + recall (issue #275, bfab491 and the 6-commit wsprd
#     port). Measured through the app's own decode_wspr_wav_f32 with the
#     fixed-seed harness in notes/: recall at -28 dB 7/8 -> 8/8, at -30 dB
#     1/8 -> 7/8, and false decodes across the sweep 16 -> 4. The rare
#     tightening that cost no recall — because it shipped alongside the
#     ~2 dB AWGN-gap closure. Full before/after in
#     notes/wspr-false-decode-baseline.md.
#   - The WSPR/JT65/JT9/Q65 burst-envelope ramp (47f0e63, issue #259), which
#     is what made this app's WSPR beacon TX shippable at all.
#   - The FT4 sniper aim-point fix (e51160b, issue #257) — the ±12 Hz
#     "aiming tolerance" this repo had recorded was the edge of a candidate-
#     starvation bug, not a capture range.
#   - WSJT-X SNR formulas for FT4/FST4/Q65 (#255/#256).
#   - d640bee zero-pads negative reports ("-08"). The packer normalises
#     either spelling to identical bits, so this changed nothing on the air,
#     but it did leave qso.js's own _autoReport as the odd one out — fixed
#     there.
#
# FT8 decoding is unaffected, checked rather than assumed at every step of
# the pin sequence and again here: qso3_busy.wav through phase1 +
# phase2(Deep) yields the same 21 decodes it did at the 11022d5 baseline
# taken before any of this started, and the ft8-bench suite output is
# identical.
#
# The decoded *text* is not identical, and an earlier version of this note
# wrongly said it was — that check had compared decode counts, not message
# bodies. d640bee changes report rendering: "W1FC F5BZB -8" now reads
# "-08", "-9" reads "-09". Same decodes, WSJT-X spelling.
#
# That turned out to matter. qso.js parses reports with `[+-]\d{2}`, so
# against the old spelling a station reporting us -1..-9 stalled the QSO
# state machine outright — no reply to their R-report, rxReport never
# captured, retry until reset. This release fixes that for free; see the
# note above the regex in qso.js.
[workspace.dependencies]
mfsk-core = { git = "https://github.com/jl1nie/mfsk-core", rev = "8ebfc2e6df4cf09c9bdee3286a19ef2478211b73", default-features = false }

# Workspace-wide release profile for the WASM cdylibs.
#
# `opt-level = 3` (was `"z"`): LDPC BP+OSD-2 is tight FP/integer-bit
# math and benefits substantially from full inlining + loop-vectorise
# style optimisation. Field measurement on uvpacket-web showed
# `~117 ms/attempt` at `"z"`; with `"3"` that should drop ~30-40 %.
# The wasm-pack output size goes up ~30 % but the network cost is
# dominated by LDPC tables and rustfft, not the codegen, so the user-
# facing diff is small.
#
# `lto = true` keeps the cross-crate inlining pass that lets mfsk-core
# routines vanish across the wasm-bindgen boundary.
[profile.release]
opt-level = 3
lto = true
